name: Build

on:
  pull_request:
    paths:
      - 'gemini-cli/**'
      - 'venice/**'
      - '.github/workflows/build.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# The plugin store installs from the repository's latest release, so every v*
# tag builds all plugins with the tag's version into that one release. Keep the
# plugin list the same in every job below.

jobs:
  test:
    name: Test ${{ matrix.plugin.id }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - { id: nopro200-gemini-cli, dir: gemini-cli, cmd: ./cmd/geminicli }
          - { id: nopro200-venice, dir: venice, cmd: ./cmd/venice }
    defaults:
      run:
        working-directory: ${{ matrix.plugin.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.plugin.dir }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.plugin.dir }}/go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.plugin.id }} ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
    needs: test
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - { id: nopro200-gemini-cli, dir: gemini-cli, cmd: ./cmd/geminicli }
          - { id: nopro200-venice, dir: venice, cmd: ./cmd/venice }
        target:
          - { goos: linux, goarch: amd64, runner: ubuntu-24.04, ext: so }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm, ext: so }
          - { goos: darwin, goarch: amd64, runner: macos-15-intel, ext: dylib }
          - { goos: darwin, goarch: arm64, runner: macos-15, ext: dylib }
          - { goos: windows, goarch: amd64, runner: windows-2025, ext: dll }
    env:
      PLUGIN_ID: ${{ matrix.plugin.id }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.plugin.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.plugin.dir }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.plugin.dir }}/go.sum

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "LIB_NAME=${PLUGIN_ID}.${{ matrix.target.ext }}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_${{ matrix.target.goos }}_${{ matrix.target.goarch }}.zip" >> "${GITHUB_ENV}"

      - name: Build shared library
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOOS=${{ matrix.target.goos }} GOARCH=${{ matrix.target.goarch }} \
            go build -trimpath -buildmode=c-shared \
              -ldflags "-s -w -X main.pluginVersion=${VERSION}" \
              -o "dist/${LIB_NAME}" ${{ matrix.plugin.cmd }}
          rm -f "dist/${PLUGIN_ID}.h"

      - name: Package plugin
        run: |
          set -euo pipefail
          go run ./tools/package-release \
            -library "dist/${LIB_NAME}" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ matrix.plugin.dir }}/${{ env.ARCHIVE_NAME }}
            ${{ matrix.plugin.dir }}/${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  build-windows-arm64:
    name: Build ${{ matrix.plugin.id }} windows/arm64
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - { id: nopro200-gemini-cli, dir: gemini-cli, cmd: ./cmd/geminicli }
          - { id: nopro200-venice, dir: venice, cmd: ./cmd/venice }
    env:
      PLUGIN_ID: ${{ matrix.plugin.id }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.plugin.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.plugin.dir }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.plugin.dir }}/go.sum

      - name: Resolve release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_windows_arm64.zip" >> "${GITHUB_ENV}"

      - name: Build Windows ARM64 shared library
        timeout-minutes: 45
        uses: go-cross/cgo-actions@v1
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        with:
          dir: ${{ matrix.plugin.dir }}
          packages: ${{ matrix.plugin.cmd }}
          targets: windows-arm64
          out-dir: ${{ github.workspace }}/${{ matrix.plugin.dir }}/dist/windows-arm64
          output: ${{ env.PLUGIN_ID }}.dll
          flags: -ldflags=-s -w
          x-flags: main.pluginVersion=${{ steps.release_metadata.outputs.version }}

      - name: Package plugin
        run: |
          set -euo pipefail
          rm -f go-cross-bin.h "dist/windows-arm64/${PLUGIN_ID}.h"
          go run ./tools/package-release \
            -library "dist/windows-arm64/${PLUGIN_ID}.dll" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ matrix.plugin.dir }}/${{ env.ARCHIVE_NAME }}
            ${{ matrix.plugin.dir }}/${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  build-freebsd:
    name: Build ${{ matrix.plugin.id }} freebsd/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - { id: nopro200-gemini-cli, dir: gemini-cli, cmd: ./cmd/geminicli }
          - { id: nopro200-venice, dir: venice, cmd: ./cmd/venice }
        goarch:
          - amd64
    env:
      PLUGIN_ID: ${{ matrix.plugin.id }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.plugin.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.plugin.dir }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.plugin.dir }}/go.sum

      - name: Resolve release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_freebsd_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"

      - name: Install FreeBSD cross-build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld

      # go-cross/cgo-actions hardcodes a FreeBSD release the mirror no longer
      # serves, so the sysroot is fetched here and pinned by its checksum.
      # shortcut: amd64 only; another goarch needs its own clang target and base.txz hash.
      - name: Build FreeBSD shared library
        timeout-minutes: 45
        env:
          FREEBSD_BASE: 14.4-RELEASE/base.txz
          FREEBSD_BASE_SHA256: 769f60a6eea2938ad6b7943cfbcc17dfaf7d1f7ba59a32b869a00349302df853
        run: |
          set -euo pipefail
          SYSROOT="${RUNNER_TEMP}/freebsd-sysroot"
          # After end of life a release moves to the archive, which serves only HTTP.
          curl -fsSL -o "${RUNNER_TEMP}/base.txz" "https://download.freebsd.org/releases/amd64/${FREEBSD_BASE}" \
            || curl -fsSL -o "${RUNNER_TEMP}/base.txz" "http://ftp-archive.freebsd.org/pub/FreeBSD-Archive/old-releases/amd64/${FREEBSD_BASE}"
          echo "${FREEBSD_BASE_SHA256}  ${RUNNER_TEMP}/base.txz" | sha256sum -c -
          mkdir -p "${SYSROOT}" "dist/freebsd-${{ matrix.goarch }}"
          sudo tar --warning=no-unknown-keyword -xf "${RUNNER_TEMP}/base.txz" -C "${SYSROOT}"
          CGO_ENABLED=1 GOOS=freebsd GOARCH=${{ matrix.goarch }} \
          CC="clang --target=x86_64-unknown-freebsd14.4 --sysroot=${SYSROOT}" CGO_LDFLAGS="-fuse-ld=lld" \
            go build -trimpath -buildmode=c-shared \
              -ldflags "-s -w -X main.pluginVersion=${VERSION}" \
              -o "dist/freebsd-${{ matrix.goarch }}/${PLUGIN_ID}.so" ${{ matrix.plugin.cmd }}

      - name: Package plugin
        run: |
          set -euo pipefail
          rm -f "dist/freebsd-${{ matrix.goarch }}/${PLUGIN_ID}.h"
          go run ./tools/package-release \
            -library "dist/freebsd-${{ matrix.goarch }}/${PLUGIN_ID}.so" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ matrix.plugin.dir }}/${{ env.ARCHIVE_NAME }}
            ${{ matrix.plugin.dir }}/${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - build-windows-arm64
      - build-freebsd
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sort dist/*.sha256 > dist/checksums.txt
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes "Automated release for ${GITHUB_REF_NAME}."
          fi
